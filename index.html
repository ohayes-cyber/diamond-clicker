<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diamond Miner</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{margin:0;padding:0;box-sizing:inherit;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#1a1a2e;font-family:'Merriweather',Georgia,'Times New Roman',serif;overflow:hidden;color:#fff}
img,canvas{image-rendering:pixelated}
.container{display:flex;height:100%}
.left{isolation:isolate;overflow:hidden;width:30%;min-width:280px;background:linear-gradient(180deg,#2d5a8aee,#162d45ee),var(--stone);background-size:auto,96px;border-right:12px solid #5c4524;border-image:var(--woodv) 0 12 0 0/0 12px 0 0 repeat;display:flex;flex-direction:column;align-items:center;padding:20px;position:relative}
.name-box{background:rgba(0,0,0,.5);border-radius:25px;padding:8px 25px;font-size:1.2em;font-weight:bold;text-shadow:2px 2px 4px #000;margin-bottom:15px;border:2px solid rgba(255,255,255,.2)}
.count-box{text-align:center;margin-bottom:10px}
.big-num{font-size:1.9em;font-weight:900;text-shadow:3px 3px 6px #000;line-height:1.1}.big-num #dc{display:block}.dcw{display:block;font-size:.62em;letter-spacing:.04em;margin-top:2px}
.per-sec{font-size:.95em;color:#ccc;text-shadow:1px 1px 2px #000}
.diamond-wrap{position:relative;width:min(100%,340px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-top:20px}
.diamond-wrap img#dimg{position:relative;z-index:1;width:52%;height:auto;transition:transform .05s;filter:drop-shadow(0 0 20px rgba(100,200,255,.35))}
.diamond-wrap:hover img#dimg{filter:drop-shadow(0 0 35px rgba(100,200,255,.7))}
.diamond-wrap:active img#dimg{transform:scale(.93)}
.shine{position:absolute;width:140%;height:140%;left:-20%;top:-20%;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(rgba(170,255,255,.34) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 6%,transparent 62%);mask:radial-gradient(circle,#000 6%,transparent 62%);animation:spin 28s linear infinite}
.shine.two{background:repeating-conic-gradient(from 10deg,rgba(255,255,255,.25) 0 4deg,transparent 4deg 31deg);animation-duration:45s;animation-direction:reverse}
.glow{position:absolute;width:95%;height:95%;left:2.5%;top:2.5%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(150,255,255,.65),rgba(0,210,210,.25) 42%,transparent 70%);animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.6;transform:scale(1.1)}}
.spark{position:absolute;width:10px;height:10px;background:#fff;box-shadow:0 0 8px 2px #8ff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;z-index:2;animation:tw 1.3s ease-in-out forwards}
@keyframes tw{0%{opacity:0;transform:scale(0)}40%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(.4) rotate(90deg)}}
.center-top,.upbar,.center-body{position:relative;z-index:1}
.falls{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.fd{position:absolute;top:0;pointer-events:none;opacity:.7;filter:brightness(.8) saturate(.9)}
.upbar{border:solid #5c3a1a;border-width:7px 0;border-image:var(--wood) 14 0 14 0/7px 0 7px 0 round;background:var(--cobble);background-size:192px;image-rendering:pixelated;box-shadow:inset 0 6px 12px rgba(0,0,0,.7)}
.upicons{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:86px;max-height:172px;padding:6px 10px;overflow-y:auto}
.upi{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;height:72px;padding:0;cursor:pointer;background:linear-gradient(#e8dfc4,#c2b27e 60%,#d2c48e);border:3px solid;border-bottom-width:5px;border-color:#ffe58a #b8860b #7a5200 #f2c94c;box-shadow:inset 0 0 0 1px rgba(255,240,170,.55),inset 0 -3px 0 rgba(0,0,0,.2),0 0 8px rgba(212,160,23,.55),0 2px 4px rgba(0,0,0,.6)}
#qname{user-select:text;-webkit-user-select:text;cursor:text;outline:none;min-width:120px;text-align:center}
#qname:hover{border-color:rgba(255,255,255,.55)}
#qname:focus{border-color:#ffd700;background:rgba(0,0,0,.75)}
button{font-family:inherit}
html .name-box,html .wood-btn,html .box,html .mode-btn,html .bulk-btn,html .ach,html .tip,html .toast,html .item{border-radius:0}
.upi:hover{filter:brightness(1.1)}
.upi .ui{font-size:1.7em;filter:drop-shadow(1px 1px 1px #000)}
.upi b{display:block;font:900 1em 'Merriweather',Georgia,serif;color:#fff;text-shadow:1px 1px 0 #000,0 0 4px #000}
.upi i{display:block;font-style:normal;font-size:.62em;font-weight:bold;color:#ff7b7b;text-shadow:1px 1px 0 #000}
.upi em{margin-left:auto;font:bold 1.9em Georgia,serif;font-style:normal;color:rgba(0,0,0,.22)}
.upi:not(.ok){background:linear-gradient(#77746c,#5c5a53);cursor:not-allowed;border-color:#9c8a45 #5e4c12 #3f3008 #85732c;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.6)}
.upi:not(.ok) .ui{filter:brightness(0) opacity(.35)}
.upi .lk{display:none;position:absolute;top:3px;right:4px;font-size:.8em}
.upi:not(.ok) .lk{display:block}
.upi.ok{opacity:1}
.upi.ok i{color:#6bff6b}
.upnone{display:inline-block;margin:10px;padding:8px 14px;background:rgba(0,0,0,.72);color:#e8d9a8;font-size:.85em;font-weight:700;text-shadow:1px 1px 2px #000}
.upi .ui img{width:46px;height:46px;display:block;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.55))}
.upi.upg-pick{background:linear-gradient(#c9c9c9,#9d9d9d 60%,#aaa);border-color:#f0f0f0 #4d4d4d #3a3a3a #dadada;box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.5)}
.upi.upg-pick:not(.ok){background:linear-gradient(#77746c,#5c5a53);border-color:#9a9a9a #3a3a3a #2a2a2a #808080;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.5)}
.upi.upg-all{background:linear-gradient(#d6f4ef,#8fd1c9 60%,#a6dcd5);border-color:#b9fff7 #12958d #0a504b #6ff2ea;box-shadow:inset 0 0 0 1px rgba(200,255,250,.5),inset 0 -3px 0 rgba(0,0,0,.2),0 0 8px rgba(40,220,200,.5),0 2px 4px rgba(0,0,0,.6)}
.upi.upg-all:not(.ok){background:linear-gradient(#6f7d7b,#4f5b59);border-color:#4f9b95 #1d4f4b #123532 #3f7f79;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.6)}
.upi .tr{position:absolute;left:4px;top:2px;font:900 .62em 'Merriweather',Georgia,serif;color:#fff;text-shadow:1px 1px 0 #000,0 0 3px #000}
.rushbar{display:none;margin:0 0 6px;padding:6px 14px 8px;min-width:210px;text-align:center;background:rgba(60,35,0,.8);border:3px solid #ffc400;box-shadow:0 0 18px rgba(255,190,30,.7);color:#ffe27a;font:900 .8em 'Merriweather',Georgia,serif;text-shadow:1px 1px 0 #000}
.rushtrack{height:6px;margin-top:6px;background:#3a2400}
.rushfill{height:100%;width:100%;background:linear-gradient(90deg,#ffb300,#fff0a0)}
.rushfx{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .6s;background:linear-gradient(115deg,transparent 30%,rgba(255,235,150,.30) 50%,transparent 70%) 0 0/250% 100%;box-shadow:inset 0 0 80px rgba(255,190,30,.55);animation:sweep 2.6s linear infinite}
.left.rush .rushfx{opacity:1}
@keyframes sweep{to{background-position:-250% 0}}
.left.rush .shine{background:repeating-conic-gradient(rgba(255,214,90,.6) 0 7deg,transparent 7deg 20deg);animation-duration:9s}
.left.rush .shine.two{background:repeating-conic-gradient(from 10deg,rgba(255,244,190,.5) 0 4deg,transparent 4deg 31deg);animation-duration:14s}
.left.rush .glow{background:radial-gradient(circle,rgba(255,225,120,.9),rgba(255,170,30,.4) 42%,transparent 70%)}
.left.rush .diamond-wrap img#dimg,.left.rush .diamond-wrap:hover img#dimg{filter:drop-shadow(0 0 28px rgba(255,200,40,.95))}
.left.rush .big-num{color:#ffe27a}
.gdia{position:fixed;z-index:1500;width:76px;cursor:inherit;animation:gappear .45s cubic-bezier(.2,1.4,.4,1)}
.gdia:before{content:'';position:absolute;inset:-55%;pointer-events:none;background:repeating-conic-gradient(rgba(255,215,90,.6) 0 8deg,transparent 8deg 24deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);animation:spin 7s linear infinite}
.gdia img{position:relative;display:block;width:100%;height:auto;filter:drop-shadow(0 0 12px rgba(255,200,40,.95)) drop-shadow(0 0 26px rgba(255,160,0,.7));animation:gfloat 2s ease-in-out infinite}
.gdia.blink img{animation:gfloat 2s ease-in-out infinite,gblink .5s steps(2) infinite}
.gdia.out{animation:gout .5s ease-in forwards;pointer-events:none}
@keyframes gappear{from{transform:scale(0) rotate(-120deg);opacity:0}}
@keyframes gfloat{50%{transform:translateY(-9px) rotate(5deg) scale(1.07)}}
@keyframes gblink{50%{opacity:.25}}
@keyframes gout{to{opacity:0;transform:scale(.2)}}
.zone{position:relative;border:solid transparent;border-width:7px 0;border-image:var(--wood) 14 0 14 0/7px 0 7px 0 round;background:#000;line-height:0}
.zone+.zone{margin-top:-7px}
.zone canvas{display:block;width:100%;height:auto;aspect-ratio:240/72;image-rendering:pixelated}
.ztab{position:absolute;right:0;bottom:0;line-height:1.2;background:rgba(10,8,6,.88);color:#fff;font:900 .68em 'Merriweather',Georgia,serif;padding:4px 10px;text-shadow:1px 1px 0 #000}
.zempty{margin:28px 24px;padding:18px 20px;text-align:center;color:#f1ead8;font-size:.85em;line-height:1.7;text-shadow:1px 1px 0 #000;background:rgba(20,14,8,.82);border:4px solid #3d2b05}
.pk{position:absolute;width:10%;pointer-events:none;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5))}
.popup{position:absolute;font-size:1.3em;font-weight:bold;pointer-events:none;text-shadow:2px 2px 4px #000;animation:fu 1s ease-out forwards;z-index:100}
@keyframes fu{to{opacity:0;transform:translateY(-80px)}}
.swing-pick{position:absolute;pointer-events:none;z-index:50;animation:sw .35s ease-out forwards}
@keyframes sw{0%{transform:rotate(-40deg) scale(.3)}50%{transform:rotate(15deg) scale(.8)}100%{transform:rotate(50deg) scale(.2);opacity:0}}
.pt{position:fixed;pointer-events:none;z-index:999;border-radius:50%}
.center{flex:1;min-width:0;background:var(--cobble);background-size:192px;image-rendering:pixelated;display:flex;flex-direction:column;position:relative;overflow:hidden}
.center-top{background:var(--wood);background-size:64px;border-bottom:8px solid #3d2b05;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.news{flex:1;text-align:center;font-weight:bold;text-shadow:2px 2px 3px #000;font-size:.95em}
.wood-btn{background:var(--wood);background-size:64px;border:3px solid #3d2b05;border-radius:6px;padding:8px 14px;color:#fff;font-weight:bold;text-shadow:2px 2px 3px #000;cursor:pointer;font-size:.9em}
.wood-btn:hover{filter:brightness(1.2)}
.center-body{flex:1;padding:0;overflow-y:auto}
.box{background:rgba(0,0,0,.35);border:4px solid #5c4524;border-radius:10px;padding:15px;margin-bottom:20px}
.box h3{color:#ffd700;margin-bottom:10px;text-shadow:2px 2px 3px #000}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.ach{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:5px;margin:3px}
.ach.on{background:rgba(255,215,0,.3);border-color:#ffd700}
.right{width:340px;min-width:280px;background:linear-gradient(180deg,#2d5a8aee,#162d45ee),var(--stone);background-size:auto,96px;border-left:12px solid #5c4524;border-image:var(--woodv) 0 0 0 12/0 0 0 12px repeat;display:flex;flex-direction:column}
.shop-head{background:var(--wood);background-size:64px;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid #3d2b05}
.mode-btn,.bulk-btn{background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.3);color:#ddd;padding:4px 12px;cursor:pointer;font-weight:bold;border-radius:3px}
.mode-btn.on,.bulk-btn.on{background:rgba(255,255,255,.25);border-color:#fff;color:#fff}
.shop-items{flex:1;overflow-y:auto;padding:10px}
.item{background:linear-gradient(#c9c9c9,#9d9d9d 60%,#aaa);border:4px solid;border-color:#f0f0f0 #4d4d4d #3a3a3a #dadada;padding:6px 10px;margin-bottom:4px;cursor:pointer;display:flex;align-items:center;gap:10px;position:relative;box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.5)}
.item:hover:not(.locked):not(.poor){filter:brightness(1.1)}
.item.poor{opacity:.72}
.item.locked{background:linear-gradient(#77746c,#5c5a53);cursor:not-allowed;opacity:.9}
.item.locked .ico{filter:brightness(0) opacity(.35)}
.item.locked .nm,.item.locked .ds,.item.locked .ct{visibility:hidden}
.item.locked:after{content:'???';position:absolute;left:70px;top:50%;transform:translateY(-50%);font-size:1.3em;color:#e8e4d8;font-weight:900;text-shadow:2px 2px 0 #000}
.ico img{width:40px;height:40px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6))}
.ico{width:45px;height:45px;font-size:1.8em;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info{flex:1}.nm{font:900 1.1em/1.15 'Merriweather',Georgia,serif;color:#fff;text-shadow:2px 2px 0 #000,0 0 6px #000}.ds{display:none}
.ct{color:#6bff6b;font-size:.85em;font-weight:900;text-shadow:1px 1px 0 #000}.poor .ct{color:#ff7b7b}
.own{font:900 2.3em 'Merriweather',Georgia,serif;color:rgba(0,0,0,.22)}
.upg-head{padding:8px;color:#ffd700;font-weight:bold;text-align:center;border-top:4px solid #5c4524;margin-top:8px}
.tip{position:fixed;background:rgba(0,0,0,.95);border:3px solid #5c4524;border-radius:8px;padding:10px;font-size:.82em;max-width:260px;z-index:1000;pointer-events:none;display:none}
.tip b{color:#ffd700;display:block;margin-bottom:4px}
.toast{position:fixed;top:20px;right:-420px;background:var(--wood);background-size:64px;border:4px solid #3d2b05;padding:12px 22px;border-radius:8px;font-weight:bold;z-index:1001;transition:right .4s;text-shadow:1px 1px 2px #000;max-width:340px}
.toast.show{right:20px}
.rebirth{position:relative;overflow:hidden;width:min(100%,300px);margin-top:14px;padding:8px 12px 9px;background:#3a3a3a;border:4px solid;border-color:#8a8a8a #1a1a1a #1a1a1a #8a8a8a;color:#d8d8d8;font:900 .95em 'Merriweather',Georgia,serif;text-shadow:2px 2px 2px #000;cursor:pointer;display:block;text-align:center;line-height:1.25;border-radius:0;z-index:3}
.rebirth .rbfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,#3fe0c4,#14917f);opacity:.75;transition:width .3s}
.rebirth .rbt,.rebirth .rbs{position:relative;display:block}
.rebirth .rbs{font-size:.72em;font-weight:700;color:#e9e9e9}
.rebirth.ready{border-color:#ffe27a #8a5a00 #8a5a00 #ffe27a;color:#fff6c8;animation:rbp 1.2s ease-in-out infinite}
.rebirth.ready .rbfill{background:linear-gradient(180deg,#ffd23a,#e08a00);opacity:.9}
@keyframes rbp{50%{box-shadow:0 0 22px 4px rgba(255,200,40,.85)}}
.rebirth:not(.ready){cursor:not-allowed}
.rbbonus{display:none;color:#ffd23a}
.ver{position:absolute;bottom:8px;left:12px;color:rgba(255,255,255,.4);font-size:.75em}
@media(max-width:820px){html,body{overflow:auto;height:auto}.container{flex-direction:column;height:auto}.left,.right{width:100%;min-width:0;border:0;border-image:none}.shop-items{max-height:none}}
@media(prefers-reduced-motion:reduce){.swing-pick{animation:none;display:none}.shine,.glow,.spark,.rushfx,.gdia:before,.gdia img{animation:none}}
</style></head>
<body>
<div class="container">
 <div class="left" id="leftp"><div class="rushfx"></div>
  <div class="falls" id="falls"></div><div class="name-box" id="qname" contenteditable="true" spellcheck="false" title="Click to rename" role="textbox" aria-label="Quarry name">Miner's Quarry</div>
  <div class="count-box"><div class="big-num"><span id="dc">0</span><span id="dcw" class="dcw">diamonds</span></div>
   <div class="per-sec">per second: <span id="dps">0</span></div>
   <div class="per-sec">per click: <span id="dpc">1</span></div><div class="per-sec rbbonus" id="rbbonus"></div></div>
  <div class="rushbar" id="rushbar"><span id="rushtxt"></span><div class="rushtrack"><div class="rushfill" id="rushfill"></div></div></div>
  <div class="diamond-wrap" id="dwrap"><div class="shine"></div><div class="shine two"></div><div class="glow"></div><img id="dimg" alt="Click to mine diamonds" draggable="false"><div id="ring" style="position:absolute;inset:0;pointer-events:none;z-index:2"></div></div>
  <button class="rebirth" id="rebB" onclick="rebirth()"><div class="rbfill" id="rbfill"></div><span class="rbt" id="rbt">Rebirth</span><span class="rbs" id="rbs"></span></button>
  <div class="ver">v1.3</div>
 </div>
 <div class="center">
  <div class="center-top">
   <button class="wood-btn" id="statsB" onclick="toggleCenter()">Stats</button>
   
   <div><button class="wood-btn" onclick="showHelp()">Info</button> <button class="wood-btn" id="rstB" onclick="doReset()">Options</button></div>
  </div>
  
  <div class="upbar"><div class="upicons" id="upicons"></div></div>
  <div class="center-body" id="cbody">
   <div id="zones"></div>
   <div id="statsView" style="display:none;padding:20px">
   <div class="box"><h3>Statistics</h3>
    <div class="stat-row"><span>Total mined:</span><span id="stTotal">0</span></div>
    <div class="stat-row"><span>Total clicks:</span><span id="stClicks">0</span></div>
    <div class="stat-row"><span>Pickaxe:</span><span id="stPick">Wood</span></div>
    <div class="stat-row"><span>Miners:</span><span id="stMiners">0</span></div>
    <div class="stat-row"><span>Rebirths:</span><span id="stReb">0</span></div>
    <div class="stat-row"><span>Gold rushes:</span><span id="stRush">0</span></div>
    <div class="stat-row"><span>Play time:</span><span id="stTime">0s</span></div></div>
   <div class="box"><h3>Achievements</h3><div id="achList"></div></div>
   </div>
  </div>
 </div>
 <div class="right">
  <div class="shop-head">
   <div><button class="mode-btn on" id="buyB" onclick="setMode('buy')">Buy</button> <button class="mode-btn" id="sellB" onclick="setMode('sell')">Sell</button></div>
   <div><button class="bulk-btn on" data-b="1" onclick="setBulk(1)">1</button> <button class="bulk-btn" data-b="10" onclick="setBulk(10)">10</button> <button class="bulk-btn" data-b="100" onclick="setBulk(100)">100</button></div>
  </div>
  <div class="shop-items" id="shop"></div>
 </div>
</div>
<div class="tip" id="tip"></div><div class="toast" id="toast"></div>
<script>
// ---------- pixel art generated in code ----------
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
var PICK=["................","....kkkkkkk.....","..kLLmmmmmmkk...","...kkkkkkmmmmk..","........kmmmmmk.",".......sS.kmmmk.","......sSt.kmmmk.",".....sSt..kmmmk.","....sSt....kmk..","...sSt.....kk...","..sSt...........",".sSt............","sSt.............","kk..............","................","................"];
function pickCanvas(k,L,m,sc){var pal={k:k,L:L,m:m,s:'#2a1c08',S:'#7a5a28',t:'#a67c36'},c=mk(16*sc,16*sc),x=c.getContext('2d');
 PICK.forEach(function(r,j){for(var i=0;i<16;i++){var ch=r[i];if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i*sc,j*sc,sc,sc)}}});return c}
var TIERS=[['#2b1d0a','#8b6a2f','#6b4f25'],['#2e2e2e','#b0b0b0','#7d7d7d'],['#161616','#f0f0f0','#c4c4c4'],['#0d4f4a','#7dffe8','#1fc7a0']];

function costN(m,k){var s=0;for(var j=0;j<k;j++)s+=Math.ceil(m.bc*Math.pow(1.15,m.n+j));return s}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},2500)}
function updCursor(){var best=0,bi=0;G.miners.forEach(function(m,i){if(m.n>0){if(m.cur>best)best=m.cur;bi=i}});G.cur=best;G.curI=bi;
 var css='html,html *{cursor:url("'+cursorPicks[CURSPR[bi]]+'") 34 4,pointer!important}';var st=$('curStyle');if(!st){st=document.createElement('style');st.id='curStyle';document.head.appendChild(st)}st.textContent=css;$('stPick').textContent=bi>=4?G.miners[bi].nm.replace(' Pickaxe',''):cursorNms[best]}
function chkUnlock(){G.miners.forEach(function(m){if(!m.un&&m.ua){var p=G.miners.find(function(x){return x.id===m.ua});if(p&&p.n>=m.uc){m.un=1;toast('Unlocked: '+m.nm+'!');drawShop()}}})}
function chkAch(){G.ach.forEach(function(a){if(G.got.indexOf(a.id)<0&&a.chk()){G.got.push(a.id);toast('Achievement: '+a.nm+'!');drawAch()}})}
function drawAch(){$('achList').innerHTML=G.ach.map(function(a){var on=G.got.indexOf(a.id)>=0;return'<div class="ach '+(on?'on':'')+'" title="'+(on?a.nm:'???')+'">'+(on?a.ico:'?')+'</div>'}).join('')}
function fmtTime(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+'h ':'')+(m?m+'m ':'')+(s%60)+'s'}

function doClick(e){var rect=dwrap.getBoundingClientRect(),t=e.touches&&e.touches[0]?e.touches[0]:e,cx=t.clientX,cy=t.clientY,x=cx-rect.left,y=cy-rect.top;

 var pk=document.createElement('img');pk.src=swingPicks[CURSPR[G.curI||0]];pk.className='swing-pick';pk.style.width='80px';pk.style.left=(x-40)+'px';pk.style.top=(y-60)+'px';dwrap.appendChild(pk);setTimeout(function(){pk.remove()},350);

 var vx=(Math.random()-.5)*6,vy=-Math.random()*6-1,life=1;(function a(){life-=.04;if(life<=0){p.remove();return}vy+=.25;p.style.left=(parseFloat(p.style.left)+vx)+'px';p.style.top=(parseFloat(p.style.top)+vy)+'px';p.style.opacity=life;requestAnimationFrame(a)})()}

// ---------- shop ----------
var tip=$('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';moveTip(e)}
function moveTip(e){var x=e.clientX>innerWidth-380?e.clientX-280:e.clientX+14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.min(e.clientY+10,innerHeight-120)+'px'}
function hideTip(){tip.style.display='none'}
function drawShop(){var h='';
 G.miners.forEach(function(m,i){h+='<div class="item'+(m.un?'':' locked')+'" data-k="m'+i+'" onclick="buyMiner('+i+')"><div class="ico"><img src="'+minerPicks[i]+'" alt=""></div><div class="info"><div class="nm">'+m.nm+'</div><div class="ds">'+m.ds+'</div><div class="ct"></div></div><div class="own">'+(m.n||'')+'</div></div>'});

 Array.prototype.forEach.call($('shop').querySelectorAll('.item'),function(el){var k=el.dataset.k,i=+k.slice(1),m=k[0]=='m';
  el.onmousemove=moveTip;el.onmouseleave=hideTip;
  el.onmouseenter=function(e){if(m){var x=G.miners[i];if(!x.un)return showTip(e,'<b>???</b>Keep buying to unlock.');showTip(e,'<b>'+x.nm+'</b>'+x.ds+'<br><i>'+x.lor+'</i><br>Each makes '+fmt(x.dps*G.pm[i]*G.gm)+' diamonds/sec<br>Owned: '+x.n+(x.n?' (total '+fmt(x.dps*G.pm[i]*G.gm*x.n)+'/sec)':''))}else{var u=G.upg[i];showTip(e,'<b>'+u.nm+'</b>'+u.ds+'<br>Cost: '+fmt(u.c))}}});
 refresh()}
function refresh(){Array.prototype.forEach.call($('shop').querySelectorAll('.item'),function(el){var k=el.dataset.k,i=+k.slice(1),ct=el.querySelector('.ct'),poor,txt;
 if(k[0]=='m'){var m=G.miners[i];if(!m.un)return;if(G.mode=='buy'){var c=costN(m,G.bulk);poor=G.dia<c;txt='◆ '+fmt(c)}else{var kk=Math.min(G.bulk,m.n),r=0;for(var j=1;j<=kk;j++)r+=Math.floor(Math.ceil(m.bc*Math.pow(1.15,m.n-j))*.25);poor=kk<1;txt='Sell for ◆ '+fmt(r)}}
 else{var u=G.upg[i];poor=G.dia<u.c;txt='◆ '+fmt(u.c)}
 ct.textContent=txt;el.classList.toggle('poor',poor)})}
function after(){updCursor();chkUnlock();drawShop();drawUpbar();renderRing();drawZones();upd();chkAch();save()}
function buyMiner(i){var m=G.miners[i];if(!m.un)return;
 if(G.mode=='buy'){var c=costN(m,G.bulk);if(G.dia>=c){G.dia-=c;m.n+=G.bulk;m.c=Math.ceil(m.bc*Math.pow(1.15,m.n));after()}}
 else{var k=Math.min(G.bulk,m.n);if(k<1)return;var r=0;for(var j=1;j<=k;j++)r+=Math.floor(Math.ceil(m.bc*Math.pow(1.15,m.n-j))*.25);m.n-=k;m.c=Math.ceil(m.bc*Math.pow(1.15,m.n));G.dia+=r;after()}}
function buyUpg(i){var u=G.upg[i];if(!u.bought&&canBuy(u)){G.dia-=u.c;u.bought=1;calcPow();hideTip();toast('Bought: '+u.nm);after()}}
function setMode(m){G.mode=m;$('buyB').classList.toggle('on',m=='buy');$('sellB').classList.toggle('on',m=='sell');refresh()}
function setBulk(n){G.bulk=n;Array.prototype.forEach.call(document.querySelectorAll('.bulk-btn'),function(b){b.classList.toggle('on',+b.dataset.b==n)});refresh()}

// ---------- ui ----------
function upd(){var ds=fmt(Math.floor(G.dia)),dsp=ds.indexOf(' ');$('dc').textContent=dsp<0?ds:ds.slice(0,dsp);$('dcw').textContent=(dsp<0?'':ds.slice(dsp+1)+' ')+'diamonds';$('dps').textContent=fmt(getDPS()*rm());$('dpc').textContent=fmt(G.cpow*rm());
 $('stTotal').textContent=fmt(Math.floor(G.total));$('stClicks').textContent=fmt(G.clicks);$('stMiners').textContent=totalMiners();$('stTime').textContent=fmtTime(G.time);$('stRush').textContent=G.rushes;
 document.title=fmt(Math.floor(G.dia))+' diamonds - '+G.name;
 var key=visUp().map(function(u){return u.id}).join();if(key!==upd.k){upd.k=key;drawUpbar()}refresh();paintUp();updReb()}
function drawUpbar(){var bar=$('upicons');bar.innerHTML='';var list=visUp();
 list.forEach(function(u){var i=G.upg.indexOf(u),b=document.createElement('div');
  b.className='upi'+(u.type==='pick'?' upg-pick':u.type==='all'?' upg-all':'');b.dataset.i=i;
  var ic=u.type==='pick'?'<img src="'+minerPicks[u.mi]+'" alt="">':(u.img?'<img src="'+u.img+'" alt="">':u.ico);
  b.innerHTML='<span class="ui">'+ic+'</span>'+(u.tier?'<b class="tr">'+u.tier+'</b>':'')+'<i>◆ '+fmt(u.c)+'</i><span class="lk">🔒</span>';
  b.onclick=function(){buyUpg(i)};
  b.onmouseenter=function(e){var why=canBuy(u)?'':(reqOk(u)?'<br><i>Locked until you can afford it</i>':'<br><i>Needs '+u.need+' '+(u.type==='pick'?G.miners[u.mi].nm+(u.need>1?'s':''):'pickaxes')+' (you have '+(u.type==='pick'?G.miners[u.mi].n:totalMiners())+')</i>');showTip(e,'<b>'+u.nm+'</b>'+u.ds+'<br>Cost: ◆ '+fmt(u.c)+why)};
  b.onmousemove=moveTip;b.onmouseleave=hideTip;bar.appendChild(b)});
 if(!list.length)bar.innerHTML='<span class="upnone">All upgrades bought. Keep mining!</span>';paintUp()}
function paintUp(){Array.prototype.forEach.call($('upicons').querySelectorAll('.upi'),function(b){b.classList.toggle('ok',canBuy(G.upg[+b.dataset.i]))})}
var fallAcc=0,fallImg=diamondCanvas(3).toDataURL();
function fallTick(dt){if(calm)return;if(rm()>1)rushFall(dt);var d=getDPS();if(d<=0)return;fallAcc+=Math.min(d,40)*dt;var box=$('falls'),k=0;while(fallAcc>=1&&k<12){fallAcc-=1;k++;spawnFall(box,box.offsetWidth,box.offsetHeight)}if(fallAcc>3)fallAcc=3}
function spawnFall(box,W,H){var im=new Image();im.src=fallImg;im.className='fd';var s=22+Math.random()*16;im.style.width=s+'px';im.style.left=Math.random()*Math.max(1,W-s)+'px';box.appendChild(im);var r=(Math.random()-.5)*360;im.animate([{transform:'translateY(-50px) rotate(0deg)'},{transform:'translateY('+(H+20)+'px) rotate('+r+'deg)'}],{duration:1300+Math.random()*4500,easing:'linear'}).onfinish=function(){im.remove()}}
G.name="Miner's Quarry";
function applyName(){$('qname').textContent=G.name;document.title=G.name}
(function(){var e=$('qname');
 e.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();e.blur()}});
 e.addEventListener('paste',function(ev){ev.preventDefault();var t=((ev.clipboardData||window.clipboardData).getData('text')||'').replace(/\s+/g,' ');document.execCommand('insertText',false,t)});
 e.addEventListener('input',function(){if(e.textContent.length>24){e.textContent=e.textContent.slice(0,24);var rg=document.createRange();rg.selectNodeContents(e);rg.collapse(false);var sl=getSelection();sl.removeAllRanges();sl.addRange(rg)}});
 e.addEventListener('blur',function(){var t=e.textContent.replace(/\s+/g,' ').trim().slice(0,24);G.name=t||"Miner's Quarry";e.textContent=G.name;save()})})();
function toggleCenter(){var s=$('statsView'),z=$('zones'),showStats=s.style.display=='none';s.style.display=showStats?'':'none';z.style.display=showStats?'none':'';$('statsB').textContent=showStats?'Mine':'Stats'}
function showHelp(){toast('Click the diamond to mine. Buy pickaxes for passive income and upgrades to boost them. Click a golden diamond for a 30 second Gold Rush (×3). Sell refunds 25%. At 100 billion diamonds mined in a run, Rebirth restarts you with a permanent ×2 on everything.')}
var rstArm=0;
function doReset(){if(!rstArm){rstArm=1;$('rstB').textContent='Erase save?';toast('Click Options again to erase your progress.');setTimeout(function(){rstArm=0;$('rstB').textContent='Options'},3000);return}
 try{localStorage.removeItem('dm1')}catch(e){}location.reload()}


// ---------- rebirth ----------
var RB_REQ=1e11,rebArm=0;
function rbMult(k){return Math.pow(2,k)}
function updReb(){var run=Math.max(0,G.total-G.rbase),p=Math.min(1,run/RB_REQ),ok=p>=1,b=$('rebB');
 $('rbfill').style.width=(p*100)+'%';b.classList.toggle('ready',ok);
 $('rbt').textContent=rebArm?'Click again to confirm':ok?'Rebirth ready!':'Rebirth';
 $('rbs').textContent=ok?'Start over with ×'+fmt(rbMult(G.rb+1))+' diamonds':fmt(Math.floor(run))+' / 100 billion';
 var bb=$('rbbonus');bb.style.display=G.rb>0?'block':'none';if(G.rb>0)bb.textContent='Rebirth bonus: ×'+fmt(rbMult(G.rb));
 $('stReb').textContent=G.rb+(G.rb?' (×'+fmt(rbMult(G.rb))+')':'')}
function rebirth(){if(G.total-G.rbase<RB_REQ){toast('Mine 100 billion diamonds in this run to rebirth.');return}
 if(!rebArm){rebArm=1;setTimeout(function(){rebArm=0},3500);updReb();return}
 if(rebBusy)return;rebArm=0;rebBusy=1;rebAnim(doRebirth)}
function doRebirth(){G.rb++;G.rbase=G.total;G.dia=0;
 G.miners.forEach(function(m){m.n=0;m.c=m.bc;m.un=m.ua?0:1});G.upg.forEach(function(u){u.bought=0});
 calcPow();hideTip();toast('Reborn! All diamonds now give ×'+fmt(rbMult(G.rb)));after()}
var rebBusy=0;
function rebAnim(cb0){var ran=0,cb=function(){if(!ran){ran=1;cb0()}};if(calm){cb();rebBusy=0;return}
 var d=$('dimg'),r=d.getBoundingClientRect(),W=innerWidth,H=innerHeight,cx=W/2,cy=H/2,dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);

 ov.animate([{background:'rgba(0,0,0,0)'},{background:'rgba(0,10,20,.72)'}],{duration:900,fill:'forwards'});
 var im=new Image();im.src=d.src;im.draggable=false;im.style.cssText='position:fixed;image-rendering:pixelated;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';ov.appendChild(im);d.style.visibility='hidden';
 setTimeout(function(){if(rebBusy){cb();ov.remove();d.style.visibility='';rebBusy=0}},7000);
 var sc=Math.min(1.5,Math.min(W,H)*.5/r.width);
 var a1=im.animate([{transform:'none',filter:'drop-shadow(0 0 8px #5ff)'},{transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')',filter:'drop-shadow(0 0 36px #7ffff0)'}],{duration:900,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
 a1.onfinish=function(){var T='translate('+dx+'px,'+dy+'px) scale(';
  var a2=im.animate([{transform:T+sc+') rotate(0deg)',filter:'drop-shadow(0 0 36px #7ffff0) brightness(1)'},{transform:T+(sc*1.05)+') rotate(-3deg)',filter:'drop-shadow(0 0 50px #fff) brightness(1.3)',offset:.2},{transform:T+(sc*1.1)+') rotate(3deg)',offset:.4},{transform:T+(sc*1.15)+') rotate(-4deg)',filter:'drop-shadow(0 0 60px #fff) brightness(1.6)',offset:.6},{transform:T+(sc*1.25)+') rotate(4deg)',offset:.8},{transform:T+(sc*1.4)+') rotate(0deg)',filter:'drop-shadow(0 0 80px #fff) brightness(2.4)'}],{duration:550,easing:'ease-in',fill:'forwards'});
  a2.onfinish=function(){im.remove();cb();
   var fl=document.createElement('div');fl.style.cssText='position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff,#9ffcf0 40%,rgba(0,0,0,0) 75%)';ov.appendChild(fl);fl.animate([{opacity:1},{opacity:0}],{duration:650,easing:'ease-out',fill:'forwards'});
   var rg=document.createElement('div');rg.style.cssText='position:absolute;left:'+cx+'px;top:'+cy+'px;width:40px;height:40px;margin:-20px;border:6px solid #aefcf2;border-radius:50%';ov.appendChild(rg);rg.animate([{transform:'scale(.3)',opacity:1},{transform:'scale('+(Math.max(W,H)/30)+')',opacity:0}],{duration:900,easing:'ease-out',fill:'forwards'});
   for(var i=0;i<80;i++){var q=new Image();q.src=fallImg;q.style.cssText='position:absolute;image-rendering:pixelated;left:'+cx+'px;top:'+cy+'px';var z=18+Math.random()*30;q.style.width=z+'px';q.style.margin=(-z/2)+'px';ov.appendChild(q);
    var an=Math.random()*6.283,di=(.25+Math.random()*.75)*Math.max(W,H)*.6,ex=Math.cos(an)*di,ey=Math.sin(an)*di,rt=(Math.random()-.5)*900;
    q.animate([{transform:'translate(0,0) rotate(0deg) scale(.4)',opacity:1},{transform:'translate('+ex+'px,'+ey+'px) rotate('+rt*.6+'deg) scale(1)',opacity:1,offset:.65},{transform:'translate('+ex*1.1+'px,'+(ey+H*.35)+'px) rotate('+rt+'deg) scale(.9)',opacity:0}],{duration:1100+Math.random()*900,easing:'cubic-bezier(.1,.8,.3,1)',fill:'forwards'})}
   setTimeout(function(){ov.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'}).onfinish=function(){ov.remove()};d.style.visibility='';rebBusy=0},1700)}}}

// ---------- save / load ----------
function save(){try{localStorage.setItem('dm1',JSON.stringify({d:G.dia,t:G.total,c:G.clicks,tm:G.time,m:G.miners.map(function(m){return[m.n,m.un]}),u:G.upg.map(function(u){return u.bought}),a:G.got,n:G.name,r:G.rushes,rb:G.rb,rs:G.rbase}))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem('dm1')||'null');if(!s)return;G.dia=s.d||0;G.total=s.t||0;G.clicks=s.c||0;G.time=s.tm||0;
 (s.m||[]).forEach(function(v,i){if(G.miners[i]){G.miners[i].n=v[0]||0;G.miners[i].un=v[1]?1:0;G.miners[i].c=Math.ceil(G.miners[i].bc*Math.pow(1.15,G.miners[i].n))}});
 (s.u||[]).forEach(function(v,i){if(G.upg[i])G.upg[i].bought=v?1:0});G.got=s.a||[];if(s.n)G.name=s.n;G.rushes=s.r||0;G.rb=s.rb||0;G.rbase=s.rs||0;calcPow()}catch(e){}}

// ---------- loop ----------
var last=performance.now(),ni=0;
setInterval(function(){var n=performance.now(),dt=Math.min((n-last)/1000,5);last=n;var g=getDPS()*dt*rm();G.dia+=g;G.total+=g;G.time+=dt;swingTick(dt);fallTick(dt);updRush();upd();chkAch()},100);
setInterval(save,5000);
setInterval(function(){if(calm)return;var s=document.createElement('div');s.className='spark';var a=Math.random()*6.28,r=14+Math.random()*30;s.style.left=(50+Math.cos(a)*r)+'%';s.style.top=(50+Math.sin(a)*r)+'%';$('dwrap').appendChild(s);setTimeout(function(){s.remove()},1300)},300);

load();applyName();updCursor();chkUnlock();drawShop();drawUpbar();renderRing();drawZones();drawAch();upd();chkAch();
if(!calm)requestAnimationFrame(zoneLoop);
schedGold(true);
</script></body></html>
